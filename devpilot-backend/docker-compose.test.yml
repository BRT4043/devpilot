# Standalone Postgres for the integration test suite (tests/integration/).
# This is separate from docker-compose.yml (the full dev stack) so you can
# run `pytest -m integration` without bringing up Redis/Qdrant/the API too.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5433/devpilot_test
#   pytest -m integration
#   docker compose -f docker-compose.test.yml down -v

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devpilot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
