databases:
  - name: devpilot-postgres
    databaseName: devpilot
    user: devpilot
    plan: free

services:
  - type: keyvalue
    name: devpilot-redis
    plan: free
    ipAllowList: []

  - type: web
    name: devpilot-api
    runtime: docker
    dockerfilePath: ./devpilot-backend/Dockerfile
    dockerContext: ./devpilot-backend
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: DATABASE_URL
        fromDatabase:
          name: devpilot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: devpilot-redis
          property: connectionString

  - type: worker
    name: devpilot-worker
    runtime: docker
    dockerfilePath: ./devpilot-backend/Dockerfile
    dockerContext: ./devpilot-backend
    dockerCommand: arq app.workers.indexing_worker.WorkerSettings
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: DATABASE_URL
        fromDatabase:
          name: devpilot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: devpilot-redis
          property: connectionString
